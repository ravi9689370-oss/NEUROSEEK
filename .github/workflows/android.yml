name: Android APK Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Frontend (Next.js Static Export)
        run: |
          cd frontend
          npm run build

      - name: Sync Capacitor
        run: |
          cd frontend
          npx cap sync android

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x frontend/android/gradlew

      - name: Build Debug APK
        run: |
          cd frontend/android
          ./gradlew assembleDebug --no-daemon

      - name: Find APK
        run: |
          find frontend/android -name "*.apk" -type f 2>/dev/null

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: neuroseek-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/*.apk
          retention-days: 7

      - name: Build Release APK (unsigned)
        run: |
          cd frontend/android
          ./gradlew assembleRelease --no-daemon

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: neuroseek-release-apk
          path: frontend/android/app/build/outputs/apk/release/*.apk
          retention-days: 7

  release:
    needs: [build-android]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download Debug APK
        uses: actions/download-artifact@v4
        with:
          name: neuroseek-debug-apk
          path: ./debug-apk

      - name: Download Release APK
        uses: actions/download-artifact@v4
        with:
          name: neuroseek-release-apk
          path: ./release-apk

      - name: List artifacts
        run: |
          ls -la ./debug-apk/
          ls -la ./release-apk/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ./debug-apk/*.apk
            ./release-apk/*.apk
          generate_release_notes: true
          tag_name: v1.0.0-${{ github.run_number }}
          name: NeuroSeek AI v1.0.0 (Build ${{ github.run_number }})
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}