name: Android APK Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Android App
        run: |
          # Check folder location
          if [ -d "frontend" ]; then
            cd frontend
          fi
          
          echo "Working in directory: $(pwd)"

          # Install packages
          npm install --legacy-peer-deps || npm install --force

          # Build web app
          npm run build || true

          # Setup Capacitor
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps || true

          if [ ! -f "capacitor.config.json" ] && [ ! -f "capacitor.config.ts" ]; then
            npx cap init "NeuroSeek" "com.neuroseek.app" --web-dir "out" || true
          fi

          if [ ! -d "android" ]; then
            npx cap add android || true
          fi

          npx cap sync android || true

          # Build APK
          if [ -d "android" ]; then
            cd android
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon
          else
            echo "Android folder build skipped"
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: neuroseek-debug-apk
          path: |
            **/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/**/*.apk
