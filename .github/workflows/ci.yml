name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ravi9689370-oss/neuroseek

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          ndk-version: r26d
          cache-key: android-sdk-${{ runner.os }}-${{ hashFiles('frontend/android/gradle/wrapper/gradle-wrapper.properties') }}
          accept-android-sdk-licenses: true
          packages: platform-tools platforms;android-34 build-tools;34.0.0

      - name: Install frontend deps
        run: |
          cd frontend
          npm ci

      - name: Build frontend for Capacitor
        run: |
          cd frontend
          npm run build

      - name: Sync Capacitor
        run: |
          cd frontend
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd frontend/android
          for i in {1..3}; do ./gradlew assembleDebug && break || sleep 30; done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: neuroseek-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/*.apk
          retention-days: 7

      - name: Build Release APK (unsigned)
        run: |
          cd frontend/android
          for i in {1..3}; do ./gradlew assembleRelease && break || sleep 30; done

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: neuroseek-release-apk
          path: frontend/android/app/build/outputs/apk/release/*.apk
          retention-days: 7

  release:
    needs: [build-android]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Download Release APK
        uses: actions/download-artifact@v4
        with:
          name: neuroseek-release-apk
          path: ./release-apk

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: ./release-apk/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}