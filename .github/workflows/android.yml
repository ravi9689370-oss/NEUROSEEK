name: Android APK Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install and Build Web App
        run: |
          if [ -d "frontend" ]; then cd frontend; fi
          npm install --legacy-peer-deps
          npm run build

      - name: Setup Capacitor
        run: |
          if [ -d "frontend" ]; then cd frontend; fi
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps
          
          if [ ! -f "capacitor.config.json" ] && [ ! -f "capacitor.config.ts" ]; then
            npx cap init "NeuroSeek" "com.neuroseek.app" --web-dir "out"
          fi
          
          npx cap add android || true
          npx cap sync android

      - name: Build APK (Force Delete Cache)
        run: |
          if [ -d "frontend" ]; then cd frontend; fi
          cd android
          
          # यह कमांड छुपी हुई करप्ट कैशे फाइल को जड़ से डिलीट कर देगी
          rm -rf ~/.gradle/caches/
          
          chmod +x gradlew
          ./gradlew clean
          ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: neuroseek-debug-apk
          path: |
            **/app/build/outputs/apk/debug/*.apk
